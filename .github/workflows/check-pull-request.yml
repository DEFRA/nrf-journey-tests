name: Check Pull Request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

jobs:
  cdp-workflows:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test code and Create Test Coverage Reports
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # --ignore-scripts skips the postinstall browser download, which this
      # lint/format job does not need. PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD does
      # not work here because postinstall calls `playwright install` directly.
      - run: npm ci --ignore-scripts
      - run: npm run security-audit
      - run: npm run format:check
      - run: npm run lint

  journey-tests:
    name: Run Journey Tests
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      id-token: write
    env:
      NOTIFY_API_KEY: ${{ secrets.NOTIFY_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./run-journey-tests
        with:
          ref: ${{ github.head_ref }}
