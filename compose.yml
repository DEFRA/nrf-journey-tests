################################################################################
# Docker Compose file for the NRF full stack used in journey tests.
#
# Services:
#   - localstack            (s3, sqs, sns, dynamodb)
#   - redis                 (nrf-frontend sessions)
#   - mongodb               (nrf-impact-assessor document store)
#   - postgres              (nrf-backend + nrf-impact-assessor databases)
#   - liquibase             (nrf-backend schema migrations)
#   - impact-assessor-migration (nrf-impact-assessor alembic migrations)
#   - cdp-uploader          (file upload service — mock virus scan enabled)
#   - nrf-backend
#   - nrf-impact-assessor
#   - nrf-frontend
#   - proxy (nginx — routes uploads to cdp-uploader, everything else to nrf-frontend)
#
# Localstack has an init script in docker/scripts/localstack.
# Playwright manages its own Chromium browser — no separate browser container needed.
# Services reference each other by container name, e.g. http://nrf-backend:3001/
#
# The nginx proxy sits in front of nrf-frontend and cdp-uploader on port 3000.
# This puts them on the same origin so the CDP Uploader's relative redirect
# (/quote/upload-received) resolves correctly back to the nrf-frontend.
#
################################################################################
services:
  ################################################################################
  localstack:
    image: localstack/localstack:3.2.0
    environment:
      # Use the Docker service name as the host so bucket/topic URLs in localstack
      # responses are reachable from other containers via Docker DNS.
      - LOCALSTACK_HOST=localstack
      # Use path-style SQS URLs (http://localstack:4566/000000000000/queue-name)
      # so GetQueueUrl responses return a URL resolvable from any container,
      # without requiring region-subdomain DNS aliases like sqs.eu-west-2.localstack.
      - SQS_ENDPOINT_STRATEGY=path
      - SERVICES=s3,sqs,sns,dynamodb
      - LS_LOG=WARN
    env_file:
      - ./docker/config/defaults.env
    volumes:
      - ./docker/scripts/localstack:/etc/localstack/init/ready.d
    networks:
      default:
        aliases:
          # SQS queue URLs returned by localstack use sqs.<region>.<LOCALSTACK_HOST>
          - sqs.eu-west-2.localstack
          # S3 virtual-hosted-style bucket URLs: <bucket>.<LOCALSTACK_HOST>
          - boundaries.localstack
          - cdp-uploader-quarantine.localstack
    healthcheck:
      test: ['CMD', 'curl', '-f', 'localhost:4566/_localstack/health']
      interval: 5s
      start_period: 30s
      retries: 10

  ################################################################################
  redis:
    image: redis:7
    restart: always
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'PING']
      interval: 5s
      start_period: 2s
      retries: 5

  ################################################################################
  cdp-uploader:
    image: defradigital/cdp-uploader:latest
    ports:
      - '7337:7337'
    environment:
      - PORT=7337
      - MOCK_VIRUS_SCAN_ENABLED=true
      - MOCK_VIRUS_RESULT_DELAY=3
      - CONSUMER_BUCKETS=boundaries
      # NODE_ENV=development enables forcePathStyle on the S3 client so bucket URLs
      # resolve via the localstack endpoint instead of virtual-hosted DNS subdomains.
      - NODE_ENV=development
    env_file:
      - ./docker/config/defaults.env
    depends_on:
      localstack:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:7337/health']
      interval: 5s
      start_period: 10s
      retries: 6

  ################################################################################
  #
  # Application services under test
  #
  ################################################################################
  nrf-frontend:
    image: defradigital/nrf-frontend:${NRF_FRONTEND:-latest}
    # No pull_policy: build here — CI only checks out ../nrf-frontend when a
    # depends-on PR provides it, otherwise this service falls back to the
    # registry image. Forcing a build would fail on CI without the source.
    build:
      context: ../nrf-frontend
      target: development
    environment:
      - PORT=3000
      - NODE_ENV=development
      - ENABLE_DEFRA_ID=false
      - NRF_BACKEND_API_URL=http://nrf-backend:3001
      - NRF_BACKEND_OPTIONAL=true
      - REDIS_HOST=redis
      # Service-to-service API keys (test only; real values come from CDP secrets)
      - BACKEND_API_KEY=local-dev-backend-key
      - IMPACT_ASSESSOR_API_KEY=local-dev-impact-assessor-key
      # Real OS Data Hub key for the draw-boundary map's location search.
      # Docker Compose substitutes this from whatever OS_API_KEY is exported
      # in the shell that runs `docker compose up` (CI secret or local
      # export) — without it the search API 401s and the draw-boundary
      # journey test can't select a real location.
      - OS_API_KEY=${OS_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 5s
      start_period: 30s
      retries: 6

  ################################################################################
  # Reverse proxy — exposes the service on port 3000 (host).
  # Routes /upload-and-scan/ to cdp-uploader and everything else to nrf-frontend.
  proxy:
    image: nginx:alpine
    ports:
      - '3000:80'
    volumes:
      - ./docker/config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      nrf-frontend:
        condition: service_healthy
      cdp-uploader:
        condition: service_healthy

  ################################################################################
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
      POSTGRES_DB: nrf_backend
    volumes:
      - ./docker/scripts/postgres/01-create-impact-db.sql:/docker-entrypoint-initdb.d/01-create-impact-db.sql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U postgres -d nrf_backend && psql -U postgres -d nrf_impact -c "SELECT 1" -q -t'
        ]
      interval: 5s
      start_period: 10s
      retries: 10

  ################################################################################
  liquibase:
    image: liquibase/liquibase:4.27-alpine
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${NRF_BACKEND_PATH:-../nrf-backend}/changelog:/liquibase/changelog
    command:
      - --url=jdbc:postgresql://postgres:5432/nrf_backend
      - --username=postgres
      - --password=password
      - --changelog-file=changelog/db.changelog.xml
      - update

  ################################################################################
  nrf-backend:
    image: defradigital/nrf-backend:${NRF_BACKEND:-latest}
    pull_policy: build
    build:
      context: ${NRF_BACKEND_PATH:-../nrf-backend}
      target: development
    environment:
      - PORT=3001
      - NODE_ENV=development
      # Service-to-service API keys (test only; real values come from CDP secrets)
      - BACKEND_API_KEY=local-dev-backend-key
      - IMPACT_ASSESSOR_API_KEY=local-dev-impact-assessor-key
    env_file:
      - ./docker/config/defaults.env
      - ./docker/config/nrf-backend.env
      # Local-only secrets (gitignored). Optional so CI works without it —
      # secrets there should come via the workflow's `env:` block.
      - path: ./.env.local
        required: false
    ports:
      - '3001:3001'
    depends_on:
      localstack:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully
      cdp-uploader:
        condition: service_healthy
      nrf-impact-assessor:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 5s
      start_period: 30s
      retries: 6

  ################################################################################
  mongodb:
    image: mongo:7
    restart: always
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 5s
      start_period: 10s
      retries: 5

  ################################################################################
  # Runs alembic migrations and loads the full reference data fixtures
  # (EDP boundaries, WWTW catchments, coefficient layers, lookup tables, etc.).
  # The nutrient assessment runner queries these layers directly — without them
  # it fails with "list index out of range".
  impact-assessor-migration:
    image: defradigital/nrf-impact-assessor:${NRF_IMPACT_ASSESSOR:-latest}
    pull_policy: build
    build:
      context: ${NRF_IMPACT_ASSESSOR_PATH:-../nrf-impact-assessor}
      target: development
    volumes:
      - ${NRF_IMPACT_ASSESSOR_PATH:-../nrf-impact-assessor}/alembic:/home/nonroot/alembic
      - ${NRF_IMPACT_ASSESSOR_PATH:-../nrf-impact-assessor}/alembic.ini:/home/nonroot/alembic.ini
      - ${NRF_IMPACT_ASSESSOR_PATH:-../nrf-impact-assessor}/scripts:/home/nonroot/scripts
      - ${NRF_IMPACT_ASSESSOR_PATH:-../nrf-impact-assessor}/tests/data/fixtures:/home/nonroot/tests/data/fixtures
    environment:
      - DB_HOST=postgres
      - DB_DATABASE=nrf_impact
      - DB_IAM_AUTHENTICATION=false
      - DB_LOCAL_PASSWORD=password
      - PYTHONPATH=/home/nonroot
    entrypoint: ['sh', '-c']
    command:
      - >-
        python3 -m alembic upgrade head &&
        python3 scripts/load_data.py --fixtures-dir tests/data/fixtures
    depends_on:
      postgres:
        condition: service_healthy

  ################################################################################
  nrf-impact-assessor:
    image: defradigital/nrf-impact-assessor:${NRF_IMPACT_ASSESSOR:-latest}
    pull_policy: build
    build:
      context: ${NRF_IMPACT_ASSESSOR_PATH:-../nrf-impact-assessor}
      target: development
    # Start the SQS consumer (which also boots the API server in a child
    # process). The image's default CMD may point at app.main only, so be
    # explicit here to guarantee the queue is polled.
    command: ['-m', 'app.consumer']
    environment:
      - HOST=0.0.0.0
      # The consumer entrypoint boots the HTTP API server in a child process via
      # uvicorn. ApiServerConfig reads API_-prefixed env vars — bind to all
      # interfaces so nrf-backend can reach /check-boundary from its container.
      - API_HOST=0.0.0.0
      - DB_HOST=postgres
      - DB_DATABASE=nrf_impact
      - DB_IAM_AUTHENTICATION=false
      - DB_LOCAL_PASSWORD=password
      - MONGO_URI=mongodb://mongodb:27017
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=eu-west-2
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_SQS_QUEUE_URL=http://localstack:4566/000000000000/nrf-impact-assessment-jobs
      # Used by the assessor to PATCH results back to nrf-backend after a job completes
      - BACKEND_BASE_URL=http://nrf-backend:3001
      # Service-to-service API keys (test only; real values come from CDP secrets)
      - IMPACT_ASSESSOR_API_KEY=local-dev-impact-assessor-key
      - BACKEND_API_KEY=local-dev-backend-key
    depends_on:
      localstack:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      impact-assessor-migration:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'python3',
          '-c',
          'import urllib.request; urllib.request.urlopen("http://localhost:8085/health")'
        ]
      interval: 5s
      start_period: 30s
      retries: 6
