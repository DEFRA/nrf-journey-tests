# CI-only overlay: shares build layers between runs through the GitHub Actions
# cache. Used by docker/scripts/ci/start-image-work.sh.
# Only nrf-impact-assessor writes the impact assessor cache: its production
# build includes the development layers that impact-assessor-migration reuses.
services:
  nrf-backend:
    build:
      cache_from:
        - type=gha,scope=nrf-backend-production
      cache_to:
        - type=gha,scope=nrf-backend-production,mode=max
  nrf-impact-assessor:
    build:
      cache_from:
        - type=gha,scope=nrf-impact-assessor-production
      cache_to:
        - type=gha,scope=nrf-impact-assessor-production,mode=max
  impact-assessor-migration:
    build:
      cache_from:
        - type=gha,scope=nrf-impact-assessor-production
